name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - name: Setup pnpm
        run: |
          corepack enable
          corepack prepare pnpm@12.16.1 --activate
      - name: Install
        run: pnpm install --no-frozen-lockfile
      - name: Typecheck
        run: pnpm run typecheck
      - name: Unit tests
        run: pnpm run test:run
      - name: Build
        run: pnpm run build
      - name: Client entry smoke
        run: pnpm run test:dist
